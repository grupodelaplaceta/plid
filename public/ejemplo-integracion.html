<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de Integración — PlacetaID</title>
  <link rel="icon" type="image/png" href="assets/faviid.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ══ GDLP CRM · Colores planos corporativos ══ */
    :root {
      --accent:      #3F00D8;
      --accent-dark: #260083;
      --accent-soft: rgba(63,0,216,0.09);
      --bg:        #f6f7fb;
      --surface:   #ffffff;
      --surface-2: #f1eef8;
      --text:      #171322;
      --text-light:#665f75;
      --line:      rgba(23,19,34,0.1);
      --green:     #23b26d;
      --red:       #e24d4d;
      --info:      #3b82f6;
      --warning:   #f59e0b;
      --radius:    14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --shadow:    0 18px 46px rgba(23,19,34,0.08);
      --shadow-lg: 0 24px 70px rgba(23,19,34,0.12);
      --font: 'Outfit', sans-serif;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: linear-gradient(160deg, var(--accent-dark) 0%, var(--accent) 50%, #5a1fff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 600px; width: 100%; }
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
    }
    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: var(--accent);
      margin: -2rem -2rem 1.75rem;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle {
      color: var(--text-light);
      margin-bottom: 2rem;
      font-size: 0.95rem;
      font-weight: 400;
    }
    .user-info {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }
    .user-info.active { display: block; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-info h2 {
      font-size: 0.75rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .user-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
    }
    .user-row:last-child { border: none; }
    .user-label { color: var(--text-light); font-weight: 500; font-size: 0.85rem; }
    .user-value { color: var(--text); font-weight: 700; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      width: 100%;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(63,0,216,0.3);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(63,0,216,0.35);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-danger {
      background: var(--red);
      color: #fff;
      margin-top: 1rem;
    }
    .btn-danger:hover {
      background: #c93a3a;
      transform: translateY(-2px);
    }
    .code-block {
      background: #1a1530;
      color: #e2e0f0;
      padding: 1rem;
      border-radius: var(--radius-sm);
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      margin: 1rem 0;
      line-height: 1.6;
      border: 1px solid rgba(63,0,216,0.2);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .status.authenticated {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status.unauthenticated {
      background: #fef2f2;
      color: var(--red);
      border: 1px solid #fecaca;
    }
    .info-box {
      background: #eff6ff;
      border-left: 4px solid var(--accent);
      padding: 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #1e40af;
    }

    /* ══ RESPONSIVE — Tablet ══ */
    @media (max-width: 768px) {
      body { padding: 1.25rem; }
      .card { padding: 1.5rem; border-radius: var(--radius-lg); }
      .card::before { margin: -1.5rem -1.5rem 1.5rem; }
      h1 { font-size: 1.45rem; }
      .subtitle { font-size: 0.88rem; margin-bottom: 1.5rem; }
      .user-info { padding: 1.25rem; }
      .user-row { padding: 0.6rem 0; }
      .code-block { font-size: 0.8rem; padding: 0.85rem; }
      .btn { font-size: 0.9rem; padding: 0.65rem 1.25rem; }
      .info-box { padding: 0.85rem; font-size: 0.85rem; }
    }

    /* ══ RESPONSIVE — Móvil ══ */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
        align-items: flex-start;
        padding-top: 1rem;
      }
      .card {
        padding: 1.1rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card::before { margin: -1.1rem -1.1rem 1.25rem; }
      h1 { font-size: 1.15rem; word-break: break-word; }
      .subtitle { font-size: 0.82rem; margin-bottom: 1.25rem; }
      .info-box {
        padding: 0.75rem;
        font-size: 0.82rem;
        margin-bottom: 1rem;
        border-left-width: 3px;
      }
      .user-info {
        padding: 0.85rem;
        margin-bottom: 1.25rem;
        border-radius: var(--radius-sm);
      }
      .user-info h2 { font-size: 0.72rem; margin-bottom: 0.65rem; }
      .user-row {
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.5rem 0;
      }
      .user-label { font-size: 0.72rem; }
      .user-value { font-size: 0.85rem; }
      .btn {
        font-size: 0.85rem;
        padding: 0.65rem 1rem;
        border-radius: 10px;
      }
      .btn-danger { margin-top: 0.65rem; }
      .btn-primary:hover {
        transform: none;
        box-shadow: 0 12px 20px rgba(63,0,216,0.4);
      }
      .code-block {
        font-size: 0.72rem;
        padding: 0.65rem;
        border-radius: 6px;
        line-height: 1.45;
        word-break: break-all;
      }
      .status {
        padding: 0.3rem 0.6rem;
        font-size: 0.68rem;
        margin-bottom: 0.65rem;
      }
    }

    /* ══ EXTRA SMALL (≤360px) ══ */
    @media (max-width: 360px) {
      body { padding: 0.5rem; padding-top: 0.75rem; }
      .card { padding: 0.85rem; }
      .card::before { margin: -0.85rem -0.85rem 1rem; }
      h1 { font-size: 1rem; }
      .subtitle { font-size: 0.75rem; }
      .code-block { font-size: 0.65rem; padding: 0.5rem; }
      .btn { font-size: 0.8rem; padding: 0.55rem 0.8rem; }
      .user-row { padding: 0.4rem 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔗 Ejemplo de Integración PlacetaID</h1>
      <p class="subtitle">Aplicación de prueba para probar el flujo de autenticación</p>

      <div class="info-box">
        ℹ️ Esta página de ejemplo muestra cómo integrar PlacetaID en tu aplicación.
      </div>

      <div id="statusContainer"></div>

      <div class="user-info" id="userInfo">
        <h2>✅ Usuario autenticado</h2>
        <div class="user-row">
          <span class="user-label">DIP</span>
          <span class="user-value" id="userDip">—</span>
        </div>
        <div class="user-row">
          <span class="user-label">Nombre completo</span>
          <span class="user-value" id="userName">—</span>
        </div>
        <div class="user-row">
          <span class="user-label">Rol</span>
          <span class="user-value" id="userRole">—</span>
        </div>
        <div class="user-row">
          <span class="user-label">Edad</span>
          <span class="user-value" id="userAge">—</span>
        </div>
      </div>

      <div id="actionContainer"></div>

      <div class="code-block" id="codeExample" style="display:none;">
        <strong>Token JWT recibido:</strong><br>
        <code id="tokenDisplay"></code>
      </div>
    </div>
  </div>

  <script>
    const PLACETAID_URL = 'https://id.laplaceta.org';
    const CALLBACK_URL = `${window.location.origin}${window.location.pathname}`;

    // Función para extraer parámetros de la URL
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        token: params.get('token'),
        user: params.get('user')
      };
    }

    // Función para manejar la redirección a PlacetaID
    function redirectToPlacetaID() {
      const encodedCallback = encodeURIComponent(CALLBACK_URL);
      window.location.href = `${PLACETAID_URL}/?from=${encodedCallback}`;
    }

    // Función para limpiar la sesión
    function logout() {
      localStorage.removeItem('placetaidToken');
      localStorage.removeItem('placetaidUser');
      window.location.href = CALLBACK_URL;
    }

    // Función para renderizar la UI
    function renderUI() {
      let token = localStorage.getItem('placetaidToken');
      let user = JSON.parse(localStorage.getItem('placetaidUser') || 'null');

      // Si hay parámetros en la URL, guardarlos
      const params = getQueryParams();
      if (params.token && params.user) {
        token = params.token;
        user = JSON.parse(decodeURIComponent(params.user));

        // Guardar en localStorage
        localStorage.setItem('placetaidToken', token);
        localStorage.setItem('placetaidUser', JSON.stringify(user));

        // Limpiar URL
        window.history.replaceState({}, document.title, CALLBACK_URL);
      }

      const statusContainer = document.getElementById('statusContainer');
      const userInfo = document.getElementById('userInfo');
      const actionContainer = document.getElementById('actionContainer');

      if (token && user) {
        // Usuario autenticado
        statusContainer.innerHTML = '<div class="status authenticated">✅ Autenticado</div>';
        
        userInfo.classList.add('active');
        document.getElementById('userDip').textContent = user.dip || '—';
        document.getElementById('userName').textContent = user.nombreCompleto || '—';
        document.getElementById('userRole').textContent = user.rol || '—';
        document.getElementById('userAge').textContent = user.edad || '—';

        actionContainer.innerHTML = '<button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>';

        // Mostrar token
        const codeExample = document.getElementById('codeExample');
        codeExample.style.display = 'block';
        document.getElementById('tokenDisplay').textContent = token.substring(0, 50) + '...';
      } else {
        // Usuario no autenticado
        statusContainer.innerHTML = '<div class="status unauthenticated">🔓 Sin autenticar</div>';
        
        userInfo.classList.remove('active');
        actionContainer.innerHTML = '<button class="btn btn-primary" onclick="redirectToPlacetaID()">Iniciar sesión con PlacetaID</button>';

        // Mostrar código de ejemplo
        const codeExample = document.getElementById('codeExample');
        codeExample.style.display = 'block';
        document.getElementById('tokenDisplay').innerHTML = `
// PlacetaID redirigirá aquí con:<br>
?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...<br>
&user=%7B%22dip%22%3A%2212345678M%22%2C...%7D
        `;
      }
    }

    // Renderizar cuando carga la página
    document.addEventListener('DOMContentLoaded', renderUI);
  </script>
</body>
</html>
